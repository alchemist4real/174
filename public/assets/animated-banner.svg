<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380" width="100%" height="100%">
  <defs>
    <!-- Dark Executive Canvas Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#050811" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Mature Neon Cyan/Violet Gradient -->
    <linearGradient id="ascii-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8; #818cf8; #6366f1; #38bdf8" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8; #6366f1; #38bdf8; #818cf8" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7; #38bdf8; #818cf8; #a855f7" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes fadeLine1 {
      0%, 10% { opacity: 0; }
      20%, 100% { opacity: 1; }
    }
    @keyframes fadeLine2 {
      0%, 30% { opacity: 0; }
      40%, 100% { opacity: 1; }
    }
    @keyframes fadeLine3 {
      0%, 50% { opacity: 0; }
      60%, 100% { opacity: 1; }
    }
    @keyframes fadeLine4 {
      0%, 70% { opacity: 0; }
      80%, 100% { opacity: 1; }
    }
    .ascii-art text {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace;
      font-size: 9.5px;
      font-weight: bold;
      fill: url(#ascii-grad);
      white-space: pre;
    }
    .term-text {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace;
      font-size: 12.5px;
      fill: #94a3b8;
    }
    .term-highlight {
      fill: #38bdf8;
      font-weight: bold;
    }
    .term-success {
      fill: #34d399;
      font-weight: bold;
    }
    .term-warn {
      fill: #fbbf24;
      font-weight: bold;
    }
    .term-accent {
      fill: #c084fc;
      font-weight: bold;
    }
    .cursor {
      fill: #38bdf8;
      animation: blink 1s infinite;
    }
    .line-1 { animation: fadeLine1 7s infinite alternate; }
    .line-2 { animation: fadeLine2 7s infinite alternate; }
    .line-3 { animation: fadeLine3 7s infinite alternate; }
    .line-4 { animation: fadeLine4 7s infinite alternate; }
  </style>

  <!-- Outer Glass Canvas -->
  <rect x="2" y="2" width="846" height="376" rx="12" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2" />

  <!-- Terminal Titlebar -->
  <path d="M 2 14 Q 2 2 14 2 L 836 2 Q 848 2 848 14 L 848 38 L 2 38 Z" fill="#0f172a" />
  <circle cx="20" cy="20" r="6" fill="#ef4444" />
  <circle cx="40" cy="20" r="6" fill="#f59e0b" />
  <circle cx="60" cy="20" r="6" fill="#10b981" />
  <text x="425" y="24" text-anchor="middle" font-family="monospace" font-size="12" fill="#64748b" font-weight="bold">mr-capsules — mcp-gateway &amp; cbt-platform — 80x24</text>
  <line x1="2" y1="38" x2="848" y2="38" stroke="#1e293b" stroke-width="1" />

  <!-- Subtle Cyber Grid Background -->
  <g opacity="0.04">
    <path d="M0 80 H850 M0 120 H850 M0 160 H850 M0 200 H850 M0 240 H850 M0 280 H850 M0 320 H850 M0 360 H850" stroke="#38bdf8" stroke-width="1" />
    <path d="M100 38 V380 M200 38 V380 M300 38 V380 M400 38 V380 M500 38 V380 M600 38 V380 M700 38 V380 M800 38 V380" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Mature Executive Block ANSI Art Header -->
  <g class="ascii-art">
    <text x="25" y="58">███╗   ███╗██████╗  ██████╗ ██████╗███████╗██╗   ██╗██╗     ███████╗███████╗</text>
    <text x="25" y="70">████╗ ████║██╔══██╗██╔════╝██╔════╝██╔════╝██║   ██║██║     ██╔════╝██╔════╝</text>
    <text x="25" y="82">██╔████╔██║██████╔╝██║     ██║     ███████╗██║   ██║██║     █████╗  ███████╗</text>
    <text x="25" y="94">██║╚██╔╝██║██╔══██╗██║     ██║     ╚════██║██║   ██║██║     ██╔══╝  ╚════██║</text>
    <text x="25" y="106">██║ ╚═╝ ██║██║  ██║╚██████╗╚██████╗███████║╚██████╔╝███████╗███████╗███████║</text>
    <text x="25" y="118">╚═╝     ╚═╝╚═╝  ╚═╝ ╚═════╝ ╚═════╝╚══════╝ ╚═════╝ ╚══════╝╚══════╝╚══════╝</text>
  </g>

  <!-- Side Badge (System Mode) -->
  <g transform="translate(685, 52)">
    <rect x="0" y="0" width="135" height="75" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="67" y="24" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">SYSTEM ARCHITECTURE</text>
    <text x="67" y="44" text-anchor="middle" font-family="monospace" font-size="12" fill="#38bdf8" font-weight="bold">v2.0 HYBRID</text>
    <circle cx="28" cy="58" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="38" y="62" font-family="monospace" font-size="10" fill="#34d399">ONLINE</text>
  </g>

  <!-- Console Log Terminal Content -->
  <g transform="translate(25, 175)" class="term-text">
    <g class="line-1">
      <text x="0" y="0">
        <tspan class="term-highlight">❯ init</tspan> mr-capsules --architecture=hybrid-sanctuary --protocol=mcp-2025
      </text>
    </g>

    <g class="line-2">
      <text x="0" y="26">
        <tspan class="term-success">[SYSTEM]</tspan> Vercel Serverless Gateway &amp; Supabase DB Engine online.
      </text>
    </g>

    <g class="line-3">
      <text x="0" y="52">
        <tspan class="term-success">[PROTOCOL]</tspan> Model Context Protocol v2025-06-18 active with <tspan class="term-warn">30+ tools</tspan> &amp; <tspan class="term-accent">OAuth 2.0 PKCE</tspan>.
      </text>
    </g>

    <g class="line-4">
      <text x="0" y="78">
        <tspan class="term-success">[SERVICES]</tspan> <tspan class="term-highlight">CBT Question Pools</tspan> • <tspan class="term-highlight">Live Study Room Engine</tspan> • <tspan class="term-highlight">Admin Kanban &amp; QA</tspan>
      </text>
    </g>

    <g transform="translate(0, 104)">
      <text x="0" y="0">
        <tspan class="term-highlight">mr-capsules@v2.0</tspan>:<tspan class="term-accent">~/sanctuary</tspan>$ ready_for_production <tspan class="cursor">█</tspan>
      </text>
    </g>
  </g>

  <!-- Status Bar Footer -->
  <g transform="translate(25, 352)" font-family="monospace" font-size="11">
    <text x="0" y="0" fill="#475569">Preserving &amp; Sharing Academic Knowledge</text>
    <text x="800" y="0" text-anchor="end" fill="#38bdf8" font-weight="bold">https://mr-capsules.vercel.app</text>
  </g>
</svg>

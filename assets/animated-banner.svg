<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>

    <!-- Animated ASCII Gradient -->
    <linearGradient id="ascii-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8; #818cf8; #c084fc; #38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8; #c084fc; #38bdf8; #818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc; #38bdf8; #818cf8; #c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes fadeLine1 {
      0%, 10% { opacity: 0; }
      20%, 100% { opacity: 1; }
    }
    @keyframes fadeLine2 {
      0%, 30% { opacity: 0; }
      40%, 100% { opacity: 1; }
    }
    @keyframes fadeLine3 {
      0%, 50% { opacity: 0; }
      60%, 100% { opacity: 1; }
    }
    @keyframes fadeLine4 {
      0%, 70% { opacity: 0; }
      80%, 100% { opacity: 1; }
    }
    .ascii-art {
      font-family: 'Courier New', Courier, 'Cascadia Code', 'Fira Code', monospace;
      font-size: 12px;
      font-weight: bold;
      fill: url(#ascii-grad);
      letter-spacing: 0px;
    }
    .term-text {
      font-family: 'Courier New', Courier, 'Cascadia Code', 'Fira Code', monospace;
      font-size: 13px;
      fill: #94a3b8;
    }
    .term-highlight {
      fill: #38bdf8;
      font-weight: bold;
    }
    .term-success {
      fill: #4ade80;
      font-weight: bold;
    }
    .term-warn {
      fill: #fbbf24;
      font-weight: bold;
    }
    .term-accent {
      fill: #c084fc;
      font-weight: bold;
    }
    .cursor {
      fill: #38bdf8;
      animation: blink 1s infinite;
    }
    .line-1 { animation: fadeLine1 7s infinite alternate; }
    .line-2 { animation: fadeLine2 7s infinite alternate; }
    .line-3 { animation: fadeLine3 7s infinite alternate; }
    .line-4 { animation: fadeLine4 7s infinite alternate; }
  </style>

  <!-- Outer Glass Canvas -->
  <rect x="2" y="2" width="846" height="356" rx="12" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2" />

  <!-- Terminal Titlebar -->
  <path d="M 2 14 Q 2 2 14 2 L 836 2 Q 848 2 848 14 L 848 38 L 2 38 Z" fill="#0f172a" />
  <circle cx="20" cy="20" r="6" fill="#ff5f56" />
  <circle cx="40" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="20" r="6" fill="#27c93f" />
  <text x="425" y="24" text-anchor="middle" font-family="monospace" font-size="12" fill="#64748b" font-weight="bold">mr-capsules — mcp-gateway &amp; cbt-platform — 80x24</text>
  <line x1="2" y1="38" x2="848" y2="38" stroke="#1e293b" stroke-width="1" />

  <!-- Subtle Cyber Grid Background -->
  <g opacity="0.05">
    <path d="M0 80 H850 M0 120 H850 M0 160 H850 M0 200 H850 M0 240 H850 M0 280 H850 M0 320 H850" stroke="#38bdf8" stroke-width="1" />
    <path d="M100 38 V360 M200 38 V360 M300 38 V360 M400 38 V360 M500 38 V360 M600 38 V360 M700 38 V360 M800 38 V360" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Animated ASCII Art Header (Explicit TSpan lines) -->
  <g transform="translate(25, 50)">
    <text class="ascii-art">
      <tspan x="0" y="12">  __  __ ____    ____    _    ____  ____  _   _ _     _____ ____  </tspan>
      <tspan x="0" y="27"> |  \/  |  _ \  / ___|  / \  |  _ \/ ___|| | | | |   | ____/ ___| </tspan>
      <tspan x="0" y="42"> | |\/| | |_) || |     / _ \ | |_) \___ \| | | | |   |  _| \___ \ </tspan>
      <tspan x="0" y="57"> | |  | |  _ &lt; | |___ / ___ \|  __/ ___) | |_| | |___| |___ ___) |</tspan>
      <tspan x="0" y="72"> |_|  |_|_| \_\ \____/_/   \_\_|   |____/ \___/|_____|_____|____/ </tspan>
    </text>
  </g>

  <!-- Side Badge (System Mode) -->
  <g transform="translate(680, 52)">
    <rect x="0" y="0" width="135" height="75" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="67" y="24" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">SYSTEM MODE</text>
    <text x="67" y="44" text-anchor="middle" font-family="monospace" font-size="12" fill="#38bdf8" font-weight="bold">v2.0 HYBRID</text>
    <circle cx="28" cy="58" r="4" fill="#4ade80">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="38" y="62" font-family="monospace" font-size="10" fill="#4ade80">ONLINE</text>
  </g>

  <!-- Console Log Terminal Content -->
  <g transform="translate(25, 160)" class="term-text">
    <g class="line-1">
      <text x="0" y="0">
        <tspan class="term-highlight">❯ init</tspan> mr-capsules --mode=sanctuary --protocol=mcp-2025
      </text>
    </g>

    <g class="line-2">
      <text x="0" y="26">
        <tspan class="term-success">[OK]</tspan> Supabase Engine &amp; Vercel Serverless API initialized.
      </text>
    </g>

    <g class="line-3">
      <text x="0" y="52">
        <tspan class="term-success">[OK]</tspan> MCP Server protocol active: <tspan class="term-warn">30+ Tools</tspan> &amp; <tspan class="term-accent">OAuth 2.0 PKCE</tspan> supported.
      </text>
    </g>

    <g class="line-4">
      <text x="0" y="78">
        <tspan class="term-success">[OK]</tspan> Modules: <tspan class="term-highlight">CBT Question Pools</tspan> | <tspan class="term-highlight">Live Study Room</tspan> | <tspan class="term-highlight">Admin Kanban &amp; QA</tspan>
      </text>
    </g>

    <g transform="translate(0, 104)">
      <text x="0" y="0">
        <tspan class="term-highlight">mr-capsules@v2.0</tspan>:<tspan class="term-accent">~/sanctuary</tspan>$ ready_for_learning <tspan class="cursor">█</tspan>
      </text>
    </g>
  </g>

  <!-- Status Bar Footer -->
  <g transform="translate(25, 332)" font-family="monospace" font-size="11">
    <text x="0" y="0" fill="#475569">Preserving &amp; Sharing Medical Knowledge</text>
    <text x="800" y="0" text-anchor="end" fill="#38bdf8" font-weight="bold">https://mr-capsules.vercel.app</text>
  </g>
</svg>
